server:
  port: 8080
  servlet:
    context-path: /api/v1   # base URL = http://localhost:8080/api/v1

spring:
  application:
    name: wfm-middleware
  jackson:
    default-property-inclusion: non_null   # non serializza i campi null
  servlet:
    multipart:
      max-file-size: 25MB     # foto/documenti allegati
      max-request-size: 25MB

# Swagger UI: http://localhost:8080/api/v1/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html


# "Database" del middleware: file Excel dove vengono persistiti Avvisi, ODL ed
# Esiti creati via Postman/Cruscotto. Creato al primo avvio se assente.
wfm:
  excel:
    path: ./data/wfm-database.xlsx
  attachments:
    dir: ./data/attachments   # file allegati (foto/documenti) salvati su disco

  firebase:
    # Percorso della chiave service account scaricata dal Passo 1.5
    service-account: ./data/firebase-service-account.json
# Parametri verso SAP (usati quando si attiverà il client SOAP).
sap:
  soap:
    endpoint: https://sap.client.local/sap/bc/srt/wsdl
    username: WFM_SERVICE
    # password: da fornire via variabile d'ambiente SAP_SOAP_PASSWORD
    client: "100"
